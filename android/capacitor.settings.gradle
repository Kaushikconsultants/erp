// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
def includePlugin(String name, String relativePath) {
    def pluginDir = new File(rootDir, relativePath)
    if (!pluginDir.exists()) {
        pluginDir = new File(relativePath)
    }
    if (pluginDir.exists()) {
        include name
        project(name).projectDir = pluginDir
    } else {
        logger.warn("Capacitor plugin directory not found: ${pluginDir.absolutePath}. Please run 'npm install' and 'npx cap sync'.")
    }
}

includePlugin(':capacitor-android', '../node_modules/@capacitor/android/capacitor')
includePlugin(':capacitor-app', '../node_modules/@capacitor/app/android')
