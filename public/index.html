<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Antigravity ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo-box {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 0.88rem; color: #64748b; margin-bottom: 24px; max-width: 320px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(79, 70, 229, 0.2);
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry-btn {
      padding: 10px 20px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo-box">AG</div>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Launching Antigravity ERP...</h1>
  <p id="desc">Connecting to enterprise services</p>
  <button class="retry-btn" id="retryBtn" onclick="window.location.reload()">Retry Connection</button>

  <script>
    if (window.location.pathname === '/index.html') {
      window.location.replace('/');
    }
  </script>
</body>
</html>
